name: Tests

on:
  push:
    # The default branch is main; this previously watched master, so no push
    # has ever triggered CI — only the nightly schedule, which failed unnoticed.
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    # Only 8.4: seven locked Symfony packages require php >= 8.4, so the lock
    # cannot install on 8.2 or 8.3 and every run against them failed at
    # composer install rather than at anything meaningful.
    strategy:
      fail-fast: false
      matrix:
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Execute tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    name: Frontend

    # The blank admin pages shipped past a green backend suite: they were
    # TypeScript errors hidden by types that did not match the API, and a
    # build the test suite never ran.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build assets
        run: npm run build
